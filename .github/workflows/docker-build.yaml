name: Build and Publish CozyVTT Images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "CozyVTT branch, tag or commit to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tsukoyachi/cozy-vtt

jobs:
  build-and-publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout this packaging repository
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      # Checkout upstream CozyVTT
      - name: Checkout CozyVTT
        uses: actions/checkout@v4
        with:
          repository: CheekyChinchilla/CozyVTT
          ref: ${{ inputs.source_ref }}
          path: src

      # Retrieve upstream commit SHA
      - name: Get source version
        id: source
        run: |
          echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish backend
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:sha-${{ steps.source.outputs.sha }}

      # Build and publish frontend
      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:sha-${{ steps.source.outputs.sha }}